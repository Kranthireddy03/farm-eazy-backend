## ===========================================
## RAZORPAY PAYMENT GATEWAY CONFIGURATION
## ===========================================
## To get your API keys:
## 1. Go to https://dashboard.razorpay.com/
## 2. Navigate to Settings > API Keys
## 3. Generate/copy your Key ID and Key Secret
## 
## For TEST mode (sandbox): Use test keys from Razorpay dashboard
## For LIVE mode: Use live keys (starts with 'rzp_live_')
##
## WARNING: Never commit real API secrets to version control!
## Use environment variables in production.
## ===========================================

# Razorpay API Key ID (public key - safe to expose to frontend)
razorpay.key.id=${RAZORPAY_KEY_ID:}

# Razorpay API Key Secret (private key - keep secure, never expose!)
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# Razorpay Webhook Secret (for verifying webhook signatures)
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# Payment settings
payment.currency=INR
payment.min.amount=10

## ===========================================
## FARMEAZY MARKETPLACE CONFIGURATION
## ===========================================
# Platform fee percentage (charged to sellers)
farmeazy.platform.fee.percentage=5.00

# Payout settings
farmeazy.payout.enabled=true
farmeazy.payout.auto.process=true

# Refund settings
farmeazy.refund.enabled=true
farmeazy.refund.auto.process=true
farmeazy.refund.max.attempts=3
farmeazy.refund.cancellation.hours=24
farmeazy.refund.return.days=7

## ===========================================
## DATABASE CONNECTION POOL (HikariCP)
## ===========================================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:60000}

## ===========================================
## AUDIT LOGGING CONFIGURATION
## ===========================================
logging.level.AUDIT_LOGGER=INFO
logging.logger.AUDIT_LOGGER.name=AUDIT_LOGGER
logging.logger.AUDIT_LOGGER.level=INFO
logging.logger.AUDIT_LOGGER.additivity=false
logging.logger.AUDIT_LOGGER.handlers=FILE
logging.file.name=logs/audit.log

spring.application.name=farmeazy-backend

# Allow circular references (needed for AuthService and SecurityConfig dependency)
spring.main.allow-circular-references=true

