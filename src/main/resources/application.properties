## Resend API Configuration (for HTTP-based email)
## ===========================================
## EMAIL PROVIDER CONFIGURATION
## ===========================================
## Provider Options: resend | zoho
## - resend: Uses Resend HTTP API (recommended for verified domains)
## - zoho: Uses Zoho SMTP (requires spring.mail.* config)
## ===========================================
farmeazy.mail.provider=resend

## Resend API Configuration (used when provider=resend)
resend.api.key=${RESEND_API_KEY}
resend.from.email=FarmEazy <no-reply@farm-eazy.com>

## Resend Multi-Sender Emails (domain verified - can use any @farm-eazy.com address)
resend.from.noreply=FarmEazy <no-reply@farm-eazy.com>
resend.from.info=FarmEazy Info <info@farm-eazy.com>
resend.from.support=FarmEazy Support <support@farm-eazy.com>
resend.from.orders=FarmEazy Orders <orders@farm-eazy.com>

# Explicit sender mapping for EmailService usage
farmeazy.mail.from=no-reply@farm-eazy.com
farmeazy.mail.noreply=no-reply@farm-eazy.com
farmeazy.mail.info=info@farm-eazy.com
farmeazy.mail.support=support@farm-eazy.com

