mail.support.password=${MAIL_SUPPORT_PASSWORD:}
mail.support.properties.mail.smtp.auth=true
mail.support.properties.mail.smtp.starttls.enable=true

# Info Account
mail.info.host=smtppro.zoho.in
mail.info.port=587
mail.info.username=${MAIL_INFO_USERNAME:info@farm-eazy.com}
