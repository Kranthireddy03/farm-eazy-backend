# Default superadmin password (must be provided via env in UAT/PROD)
superadmin.default.password=${SUPERADMIN_DEFAULT_PASSWORD:}
# Admin/support portal host and UI entrypoint (authenticated ticket users inside portal)
# Local dev override: http://localhost:5173
farmeazy.app.support-base-url=${FARMEAZY_SUPPORT_BASE_URL:https://support.farm-eazy.com}
# Public user site host (public FAQ/ticket tracking, no login required)
# Local dev override: http://localhost:5173
farmeazy.app.public-base-url=${FARMEAZY_PUBLIC_BASE_URL:https://www.farm-eazy.com}
# Backward compatibility: fallback base URL, used if neither support nor public URL is set.
# Local dev fallback to public.
farmeazy.app.base-url=${FARMEAZY_APP_BASE_URL:https://www.farm-eazy.com}
