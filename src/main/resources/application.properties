# Superadmin bootstrap password (must come from environment)
superadmin.default.password=${SUPERADMIN_DEFAULT_PASSWORD}
# Admin/support portal host and UI entrypoint (authenticated ticket users inside portal)
# UAT default: https://support.farm-eazy.com
farmeazy.app.support-base-url=${FARMEAZY_SUPPORT_BASE_URL}
# Public user site host (public FAQ/ticket tracking, no login required)
# UAT default: https://farm-eazy.com
farmeazy.app.public-base-url=${FARMEAZY_PUBLIC_BASE_URL}
# Backward compatibility: fallback base URL, used if neither support nor public URL is set.
# UAT fallback to public.
farmeazy.app.base-url=${FARMEAZY_APP_BASE_URL}
# Use IST for all JSON date/time serialization and deserialization
spring.jackson.time-zone=Asia/Kolkata

# Security hardening defaults
captcha.enabled=false
captcha.secret-key=
captcha.verify-url=https://www.google.com/recaptcha/api/siteverify
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false

