## ===========================================
## RAZORPAY PAYMENT GATEWAY CONFIGURATION
## ===========================================
## To get your API keys:
## 1. Go to https://dashboard.razorpay.com/
## 2. Navigate to Settings > API Keys
## 3. Generate/copy your Key ID and Key Secret
## 
## For TEST mode (sandbox): Use test keys from Razorpay dashboard
## For LIVE mode: Use live keys (starts with 'rzp_live_')
##
## WARNING: Never commit real API secrets to version control!
## Use environment variables in production.
## ===========================================

# Razorpay API Key ID (public key - safe to expose to frontend)
razorpay.key.id=${RAZORPAY_KEY_ID}

# Razorpay API Key Secret (private key - keep secure, never expose!)
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# Razorpay Webhook Secret (for verifying webhook signatures)
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

# Payment settings
payment.currency=INR
payment.min.amount=10

## ===========================================
## FARMEAZY MARKETPLACE CONFIGURATION
## ===========================================
# Platform fee percentage (charged to sellers)
farmeazy.platform.fee.percentage=5.00

# Payout settings
farmeazy.payout.enabled=true
farmeazy.payout.auto.process=true

# Refund settings
farmeazy.refund.enabled=true
farmeazy.refund.auto.process=true
farmeazy.refund.max.attempts=3
farmeazy.refund.cancellation.hours=24
farmeazy.refund.return.days=7

## ===========================================
## DATABASE CONNECTION POOL (HikariCP)
## ===========================================
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

## ===========================================
## AUDIT LOGGING CONFIGURATION
## ===========================================
logging.level.AUDIT_LOGGER=INFO
logging.logger.AUDIT_LOGGER.name=AUDIT_LOGGER
logging.logger.AUDIT_LOGGER.level=INFO
logging.logger.AUDIT_LOGGER.additivity=false
logging.logger.AUDIT_LOGGER.handlers=FILE
logging.file.name=logs/audit.log

spring.application.name=farmeazy-backend

# Allow circular references (needed for AuthService and SecurityConfig dependency)
spring.main.allow-circular-references=true

## PostgreSQL Configuration (Supabase, commented for local)
# spring.datasource.url=jdbc:postgresql://localhost:5432/your_local_db
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.datasource.username=your_local_db_user
# spring.datasource.password=your_local_db_password

# JPA Configuration
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

## H2 File-Based Database Configuration (Persistent Data)
# Data is stored in ./data/farmeazy_db
spring.datasource.url=jdbc:h2:file:./data/farmeazy_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console


# Logging
logging.level.root=INFO
logging.level.com.farmeazy=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
logging.level.org.springframework.security=WARN

# Toggle deep trace logging when needed for debugging
app.logging.trace-all=${APP_LOGGING_TRACE_ALL:false}

jwt.secret=${JWT_SECRET}
jwt.expiration=7200000
jwt.expiration.user=7200000
jwt.expiration.admin=3600000
jwt.refresh-expiration=2592000000
security.jwt.fast-auth-enabled=${JWT_FAST_AUTH_ENABLED:false}
security.jwt.debug-enabled=${JWT_DEBUG_ENABLED:false}

# API payload encryption (request + response)
security.api.encryption.enabled=${API_ENCRYPTION_ENABLED:false}
security.api.encryption.require-encrypted-request=${API_ENCRYPTION_REQUIRE_REQUEST:true}
security.api.encryption.secret=${API_ENCRYPTION_SECRET}

# API gateway signature validation
security.api.gateway.enabled=${API_GATEWAY_ENABLED:true}
security.api.gateway.required=${API_GATEWAY_REQUIRED:true}
security.api.gateway.shared-secret=${API_GATEWAY_SECRET}
security.api.gateway.allowed-clients=${API_GATEWAY_ALLOWED_CLIENTS:farmeazy-frontend,farmeazy-web,farmeazy-admin}
security.api.gateway.max-skew-seconds=${API_GATEWAY_MAX_SKEW_SECONDS:300}
security.api.gateway.replay-protection.enabled=${API_GATEWAY_REPLAY_PROTECTION_ENABLED:true}

# Resilience4j circuit breakers (status probes and external dependency guards)
resilience4j.circuitbreaker.instances.dbProbe.sliding-window-size=10
resilience4j.circuitbreaker.instances.dbProbe.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.dbProbe.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.dbProbe.wait-duration-in-open-state=20s

resilience4j.circuitbreaker.instances.redisProbe.sliding-window-size=10
resilience4j.circuitbreaker.instances.redisProbe.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.redisProbe.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.redisProbe.wait-duration-in-open-state=20s

resilience4j.circuitbreaker.instances.paymentProbe.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentProbe.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.paymentProbe.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentProbe.wait-duration-in-open-state=30s

resilience4j.circuitbreaker.instances.notificationProbe.sliding-window-size=10
resilience4j.circuitbreaker.instances.notificationProbe.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.notificationProbe.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notificationProbe.wait-duration-in-open-state=30s

resilience4j.circuitbreaker.instances.paymentCreateOrder.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentCreateOrder.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.paymentCreateOrder.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentCreateOrder.wait-duration-in-open-state=20s

resilience4j.circuitbreaker.instances.paymentVerifyFetch.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentVerifyFetch.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.paymentVerifyFetch.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentVerifyFetch.wait-duration-in-open-state=20s

resilience4j.circuitbreaker.instances.emailPrimarySend.sliding-window-size=20
resilience4j.circuitbreaker.instances.emailPrimarySend.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.emailPrimarySend.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.emailPrimarySend.wait-duration-in-open-state=30s

resilience4j.circuitbreaker.instances.emailFallbackSend.sliding-window-size=20
resilience4j.circuitbreaker.instances.emailFallbackSend.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.emailFallbackSend.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.emailFallbackSend.wait-duration-in-open-state=30s

# Secure Redis configuration
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
