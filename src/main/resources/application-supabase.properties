# ============================================================================
# SPRING BOOT PRODUCTION CONFIGURATION FOR SUPABASE
# ============================================================================
# Last Updated: 2026-02-02 - Force redeploy for CORS/Auth fix
#
# Filename: application-supabase.properties
# Purpose: Production configuration when running on Supabase with PostgreSQL
# When Used: Activated with Spring profile: spring.profiles.active=supabase
# 
# Usage:
# - Locally: java -Dspring.profiles.active=supabase -jar app.jar
# - Docker: ENV SPRING_PROFILES_ACTIVE=supabase
# - Application: server will use this config instead of application.properties
#
# ============================================================================

# ============================================================================
# APPLICATION IDENTIFICATION
# ============================================================================

# Application Name
# Used in logs, metrics, and monitoring dashboards
spring.application.name=farmeazy-backend

# Server Port
# Which port the Spring Boot application listens on
# Note: Supabase/Cloud platforms may override this
server.port=${PORT:8080}

# Allow Circular References
# Needed because AuthService implements UserDetailsService and uses SecurityConfig
# Without this: BeanCurrentlyInCreationException during startup
spring.main.allow-circular-references=true

# ============================================================================
# DATABASE CONFIGURATION - POSTGRESQL (SUPABASE)
# ============================================================================
#
# Supabase provides managed PostgreSQL database with automatic backups
# 
# Connection Details:
# You get these from Supabase Dashboard → Settings → Database → Connection Info
#
# Standard Connection String Format:
# jdbc:postgresql://[HOST]:[PORT]/[DATABASE]
# Example: jdbc:postgresql://db.abc123xyz.supabase.co:5432/postgres
#
# Required Variables:
# - DB_HOST: Supabase host (db.xxx.supabase.co)
# - DB_PORT: PostgreSQL port (usually 5432)
# - DB_NAME: Database name (usually "postgres")
# - DB_USER: Database user (usually "postgres")
# - DB_PASSWORD: Database password (set in environment variables)
#

# PostgreSQL Database URL (Supabase)
# Set via env: SPRING_DATASOURCE_URL; fallback uses pooled endpoint with SSL and short timeouts
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require&connectTimeout=10&socketTimeout=10}

# Database Username (override with SPRING_DATASOURCE_USERNAME if needed)
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.cvxdennhjzagwubxktjr}

# Database Password (must be provided via env in UAT/PROD)
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

# JDBC Driver Class
# Tells Spring which database driver to use
# org.postgresql.Driver = PostgreSQL JDBC driver (included in pom-supabase.xml)
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================================
# HIBERNATE/JPA CONFIGURATION
# ============================================================================
#
# Hibernate is the ORM (Object-Relational Mapping) framework
# It converts Java objects to SQL and vice versa
#
# JPA (Java Persistence API) is the standard interface
# Hibernate is the implementation that does the actual work
#

# Hibernate Dialect
# Tells Hibernate how to generate SQL for this specific database
# PostgreSQLDialect = optimized SQL for PostgreSQL
# Hibernate knows PostgreSQL syntax, reserved words, types, etc
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate DDL Auto Policy
# What should Hibernate do with tables when app starts?
#
# Options:
# - validate: Check schema exists, don't modify (safest for production)
# - update: Create/update tables from @Entity annotations (good for dev)
# - create: Drop all tables and recreate (dangerous!)
# - create-drop: Create on startup, drop on shutdown (testing)
# - none: Do nothing, manual schema management
#
# Production: never use Hibernate live mutation on PostgreSQL
# Can override via env var: SPRING_JPA_HIBERNATE_DDL_AUTO=validate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

# Show SQL in Console (Debug Only)
# Logs every SQL query executed
# Turn OFF in production (performance, security, log spam)
spring.jpa.show-sql=false

# Format SQL for Readability
# If show-sql=true, this makes output readable
spring.jpa.properties.hibernate.format_sql=true

# Disable Open Session in View so DB connections are not held until response rendering.
spring.jpa.open-in-view=false

# Hikari connection pool tuning for cloud Postgres.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.leak-detection-threshold=${DB_POOL_LEAK_DETECTION_MS:60000}

# PostgreSQL Specific Dialect (Hibernate 6+ use generic dialect)
# Explicitly set to PostgreSQLDialect to avoid missing class errors on Render
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Run schema SQL before JPA validation so missing columns can be added safely.
## Disable Spring SQL initialization in production; DB schema must be managed externally.
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
#
# Controls what gets logged and at what detail level
# Levels (from least to most verbose): FATAL, ERROR, WARN, INFO, DEBUG, TRACE
#

# Root Logger Level
# Default level for all loggers if not specified
logging.level.root=INFO

# FarmEazy Application Logging
# Shows DEBUG messages from your application code
# Useful for development, should be INFO or WARN in production
logging.level.com.farmeazy=DEBUG

# Spring Framework Logging
# Less verbose than default to reduce noise
# Hides Spring's debug info (you don't need to see it normally)
logging.level.org.springframework=WARN

# Spring Boot Logging
# Hides Spring Boot startup noise
logging.level.org.springframework.boot=WARN

# Tomcat (Embedded Web Server) Logging
# Shows INFO level tomcat messages (connection info, etc)
logging.level.org.springframework.boot.web.embedded.tomcat=INFO

# Spring Security Logging
# Hides security framework debug logs
# Turn to DEBUG if having auth issues
logging.level.org.springframework.security=WARN

# ============================================================================
# JWT (JSON Web Token) CONFIGURATION
# ============================================================================
#
# JWT is used for stateless authentication
# User logs in → receives JWT token → includes token in future requests
# Server validates token signature → grants access
#

# JWT Secret Key
# Used to sign and verify JWT tokens
# MUST be at least 32 characters for HMAC-SHA512 (used in JwtUtil)
# MUST be kept secret! Never commit real key to git!
# 
# Set via environment variable: JWT_SECRET
# Example command: export JWT_SECRET="YourSuperSecretKeyWith32+Characters"
#
# Security Note:
# - If leaked, attacker can forge tokens with any user
# - Rotate regularly in production
# - Generate with: openssl rand -base64 32
jwt.secret=${JWT_SECRET}

# JWT Token Expiration
# How long until token expires (in milliseconds)
# 86400000 = 24 hours = 1 day
#
# After expiration:
# - Token becomes invalid
# - User must login again to get new token
# - Frontend should have refresh token mechanism (optional)
#
# Production Values:
# - Short-lived: 1 hour = 3600000
# - Standard: 24 hours = 86400000
# - Long-lived: 7 days = 604800000
jwt.expiration=86400000
security.jwt.fast-auth-enabled=${JWT_FAST_AUTH_ENABLED:false}
security.jwt.debug-enabled=${JWT_DEBUG_ENABLED:false}

# ============================================================================
# CORS CONFIGURATION
# ============================================================================
#
# CORS = Cross-Origin Resource Sharing
# Controls which websites can make requests to your API
#
# Scenario:
# - Frontend: https://farmeazy.vercel.app (Vercel)
# - Backend: https://api.farmeazy.com (Supabase)
# - These are DIFFERENT origins → CORS applies
# - Without CORS config: Browser blocks API requests
#
# SECURITY:
# - Only list trusted domains
# - Never use "*" (allow all) in production
# - Attackers can make your API act on their behalf
#

# Allowed Origins
# Which domain origins can make requests to this API
# Comma-separated list of full URLs (protocol + domain)
#
# Examples:
# - Development: http://localhost:4200,http://localhost:3000
# - Production: https://farmeazy.vercel.app,https://farmeazy.com
#
# UAT/PROD defaults for FarmEazy frontend domains (override via env if needed)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://support.farm-eazy.com,https://www.farm-eazy.com,https://admin-support-portal.vercel.app}

# Allowed HTTP Methods
# Which HTTP verbs can be used in CORS requests
# Common: GET (read), POST (create), PUT (update), DELETE (remove), OPTIONS (preflight)
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS

# Allowed Headers
# Which headers browsers can include in requests
# "*" = allow any header (usually fine for APIs)
cors.allowed-headers=*

# Allow Credentials
# Whether cookies/authentication headers are allowed
# true = frontend can send Authorization header with token
# false = no auth headers allowed
cors.allow-credentials=true

# ============================================================================
# SSL/TLS CONFIGURATION
# ============================================================================
#
# HTTPS encryption for secure communication
#

# Disable SSL (Render/Reverse proxy terminates HTTPS)
server.ssl.enabled=false

# Context Path
# Base path for all API endpoints
# Example: /api makes endpoints: /api/auth/login, /api/farms, etc
# Without this: endpoints are / prefix: /auth/login, /farms, etc
server.servlet.context-path=

# ============================================================================
# SWAGGER/OPENAPI DOCUMENTATION
# ============================================================================
#
# Automatic API documentation from code annotations
# Helps frontend developers understand API endpoints
#

# API Docs Path
# Where Swagger JSON is served
# Endpoint: GET /api/v3/api-docs
# Returns: Machine-readable API spec in JSON format
springdoc.api-docs.path=/v3/api-docs

# Swagger UI Path
# Interactive web interface for testing API
# Access: http://localhost:8080/api/swagger-ui.html
# Allows: Testing endpoints, viewing docs, no code needed
springdoc.swagger-ui.path=/swagger-ui.html

# ============================================================================
# RESEND EMAIL CONFIGURATION (HTTP-based, works on Render free tier)
# ============================================================================
#
# Resend is an HTTP-based email service that uses REST API instead of SMTP.
# This works on platforms like Render that block outbound SMTP connections.
#
# Setup:
# 1. Sign up at https://resend.com (free tier: 3000 emails/month)
# 2. Create an API key from the dashboard
# 3. Verify your domain in Resend (required to send to any email)
# 4. Set RESEND_API_KEY environment variable in Render
# 5. Set RESEND_FROM_EMAIL to your verified domain email
#
# IMPORTANT: Without a verified domain, you can only send to your own email!
#

# Resend API Key (set via environment variable RESEND_API_KEY)
resend.api.key=${RESEND_API_KEY:}

# From email address - MUST use verified domain to send to any recipient
# Format: "Display Name <email@verified-domain.com>"
# Example: "FarmEazy <no-reply@farm-eazy.com>"
resend.from.email=${RESEND_FROM_EMAIL:FarmEazy <no-reply@farm-eazy.com>}

# Enable/disable email sending
farmeazy.mail.enabled=${MAIL_ENABLED:true}

# ============================================================================
# SUMMARY OF SETUP STEPS
# ============================================================================
#
# 1. Create Supabase Project
#    - Go to supabase.com
#    - Create new project
#    - Get connection details from Settings → Database
#
# 2. Set Environment Variables
#    - DB_PASSWORD: Your Supabase postgres password
#    - JWT_SECRET: Generate with: openssl rand -base64 32
#    - Set in: Docker ENV, Supabase Environment Variables, or cloud platform
#
# 3. Update Database URL
#    - Replace "XXXX" in spring.datasource.url with your project ID
#    - Get project ID from Supabase settings
#
# 4. Update CORS Origins
#    - Replace urls in cors.allowed-origins with your Vercel domain
#
# 5. Build and Deploy
#    - Build: mvn clean package -P supabase
#    - Docker: docker build -t farmeazy-backend:latest .
#    - Deploy: Push Docker image to registry, deploy to Supabase
#
# 6. Test Connection
#    - Check logs: docker logs [container-id]
#    - Hit endpoint: curl https://api.your-domain.com/api/swagger-ui.html
#    - Database working: Check Supabase Dashboard
#
# ============================================================================
