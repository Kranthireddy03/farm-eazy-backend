<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{TITLE}}</title>
</head>
<body style="margin:0; padding:0; background:#f5f7fa; font-family:Arial, Helvetica, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="padding:24px 0;">
    <tr>
      <td align="center">
        <table width="640" cellpadding="0" cellspacing="0" style="background:#ffffff; border:1px solid #dde3ea; border-radius:8px; overflow:hidden;">
          <tr>
            <td style="background:#1f2937; color:#ffffff; padding:16px 24px; font-size:18px; font-weight:bold;">{{APP_NAME}} | Notification</td>
          </tr>
          <tr>
            <td style="padding:22px 24px; font-size:14px; color:#1f2937; line-height:1.6;">
              <h2 style="margin:0 0 10px 0; font-size:20px;">{{TITLE}}</h2>
              <p style="margin:0 0 14px 0; color:#374151;">{{INTRO}}</p>
              <div style="background:#f3f4f6; border-left:4px solid #1f2937; padding:12px; font-size:13px;">{{DETAILS}}</div>
              <p style="margin-top:20px; text-align:center;">
                <a href="{{ACTION_URL}}" style="display:inline-block; background:#1f2937; color:#fff; text-decoration:none; padding:10px 20px; border-radius:4px;">{{ACTION_TEXT}}</a>
              </p>
            </td>
          </tr>
          <tr>
            <td style="background:#f9fafb; padding:12px 24px; font-size:12px; color:#6b7280;">Copyright {{YEAR}} {{APP_NAME}}.</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
