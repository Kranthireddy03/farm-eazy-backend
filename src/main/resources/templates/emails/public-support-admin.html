<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Public Support Message</title>
</head>
<body style="margin:0; padding:0; background:#f4f4f7; font-family:Arial, Helvetica, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="padding:24px 0;">
    <tr>
      <td align="center">
        <table width="620" cellpadding="0" cellspacing="0" style="background:#ffffff; border-radius:8px; border:1px solid #dbe2ea; overflow:hidden;">
          <tr>
            <td style="background:#4CAF50; color:#fff; padding:16px 22px; font-size:20px; font-weight:bold;">New Public Support Message</td>
          </tr>
          <tr>
            <td style="padding:22px; font-size:14px; color:#1f2937; line-height:1.6;">
              <table width="100%" cellpadding="0" cellspacing="0" style="font-size:13px; color:#374151;">
                <tr><td style="padding:6px 0; width:140px;">Name:</td><td style="padding:6px 0;"><strong>{{NAME}}</strong></td></tr>
                <tr><td style="padding:6px 0;">Email:</td><td style="padding:6px 0;"><strong>{{EMAIL}}</strong></td></tr>
                <tr><td style="padding:6px 0;">Subject:</td><td style="padding:6px 0;"><strong>{{SUBJECT}}</strong></td></tr>
              </table>
              <h4 style="margin:18px 0 10px 0;">Message</h4>
              <div style="background:#f3f4f6; border-left:4px solid #4CAF50; padding:12px; font-size:13px;">{{MESSAGE}}</div>
              <p style="margin-top:18px;"><a href="{{REPLY_MAILTO}}" style="display:inline-block; background:#4CAF50; color:#fff; text-decoration:none; padding:10px 20px; border-radius:4px;">Reply to User</a></p>
            </td>
          </tr>
          <tr>
            <td style="background:#f9fafb; padding:12px 22px; font-size:12px; color:#6b7280;">Copyright {{YEAR}} FarmEazy.</td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
